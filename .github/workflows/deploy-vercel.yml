name: Deploy dashboard to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project metadata (production env)
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # Let Vercel install + build + deploy in one shot. --prebuilt was
      # tempting for speed but pnpm 10's peer-dep hash format doesn't
      # match what "vercel deploy --prebuilt" expects to find on disk,
      # so it 404's on styled-jsx even when node_modules has it.
      - name: Deploy to production
        run: vercel deploy --prod --token=$VERCEL_TOKEN
